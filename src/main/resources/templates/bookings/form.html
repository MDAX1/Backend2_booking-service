<!DOCTYPE html>
<html lang="sv" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"><title>Pensionat</title></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="bk-page-bar">
    <div class="container">
        <h2 th:text="${pageTitle}"><i class="bi bi-calendar-plus me-2"></i>Bokning</h2>
        <div class="bk-breadcrumb">
            <a th:href="@{/}">Hem</a>
            <span class="sep">/</span>
            <a th:href="@{/bookings}">Bokningar</a>
            <span class="sep">/</span>
            <span th:text="${pageTitle}">Ny bokning</span>
        </div>
    </div>
</div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">

            <!-- Error alert -->
            <div class="bk-alert-danger mb-3" th:if="${errorMessage}">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}"></span>
            </div>

            <div class="bk-card">
                <div class="bk-card-header">
                    <i class="bi bi-calendar-check me-2" style="color:var(--bk-blue)"></i>
                    <span th:text="${pageTitle}">Bokningsformulär</span>
                </div>
                <div class="p-4">
                    <form method="post"
                          th:action="${bookingId == null ? '/bookings' : '/bookings/' + bookingId}">

                        <!-- Customer -->
                        <div class="mb-3">
                            <label class="bk-label">
                                <i class="bi bi-person me-1"></i>Kund
                                <span class="text-danger">*</span>
                            </label>
                            <input class="form-control bk-input" type="number" name="customerId"
                                   th:value="${selectedCustomerId}" required
                                   placeholder="Ange kundens ID">
                            <div class="mt-1 d-flex justify-content-between align-items-center" style="font-size:12px; color:var(--bk-text-light)">
                                <span>Kundens ID hittar du i kundtjänsten. Kunden kontrolleras när bokningen sparas.</span>
                                <a th:href="@{/customers}" target="_blank" style="color:#006ce4;font-weight:700;text-decoration:none">
                                    <i class="bi bi-box-arrow-up-right me-1"></i>Öppna kundtjänst
                                </a>
                            </div>
                        </div>

                        <!-- Room -->
                        <div class="mb-3">
                            <label class="bk-label">
                                <i class="bi bi-door-open me-1"></i>Rum
                                <span class="text-danger">*</span>
                            </label>
                            <select class="form-select bk-input" name="roomId" required>
                                <option value="">– Välj rum –</option>
                                <option th:each="r : ${rooms}"
                                        th:selected="${r.id == selectedRoomId}"
                                        th:text="${'Rum ' + r.roomNumber + ' – ' + r.typeDescription + ' – ' + #numbers.formatDecimal(r.pricePerNight,1,'COMMA',0,'POINT') + ' kr/natt'}"
                                        th:value="${r.id}"></option>
                            </select>
                        </div>

                        <!-- Dates -->
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="bk-label">
                                    <i class="bi bi-calendar-arrow-down me-1"></i>Incheckning
                                    <span class="text-danger">*</span>
                                </label>
                                <input class="form-control bk-input" name="checkIn" required
                                       th:value="${selectedCheckIn}" type="date">
                            </div>
                            <div class="col-6">
                                <label class="bk-label">
                                    <i class="bi bi-calendar-arrow-up me-1"></i>Utcheckning
                                    <span class="text-danger">*</span>
                                </label>
                                <input class="form-control bk-input" name="checkOut" required
                                       th:value="${selectedCheckOut}" type="date">
                            </div>
                        </div>

                        <!-- Guests -->
                        <div class="mb-4">
                            <label class="bk-label">
                                <i class="bi bi-people me-1"></i>Antal gäster
                                <span class="text-danger">*</span>
                            </label>
                            <select class="form-select bk-input" name="numberOfGuests" required>
                                <option th:each="n : ${#numbers.sequence(1,4)}"
                                        th:selected="${n == selectedGuests}"
                                        th:text="${n + (n == 1 ? ' gäst' : ' gäster')}"
                                        th:value="${n}"></option>
                            </select>
                        </div>

                        <!-- Info box -->
                        <div style="background:#f0f7ff; border:1px solid #c0d8ff; border-radius:6px; padding:12px 14px; margin-bottom:20px; font-size:13px;">
                            <i class="bi bi-info-circle-fill me-2" style="color:var(--bk-blue)"></i>
                            Priset beräknas automatiskt baserat på rum och antal nätter vid sparande.
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-bk px-4" type="submit">
                                <i class="bi bi-check-lg me-1"></i>Spara bokning
                            </button>
                            <a class="btn btn-outline-secondary" th:href="@{/bookings}">
                                <i class="bi bi-x me-1"></i>Avbryt
                            </a>
                        </div>
                    </form>
                </div>
            </div>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
